# yamllint config for CI (.github/workflows/ci.yaml, job `yaml`). Relaxed on purpose: this repo's YAML is
# machine config, k8s manifests and workflows, not prose, so the stylistic rules are off and only real
# syntax/structure errors fail the job.
extends: relaxed
rules:
  line-length: disable          # long renovate/annotation/URL lines are fine
  truthy: disable               # k8s manifest on/off/yes styling is not an error here
  colons: disable               # some files are column-aligned (key:   value) on purpose
  empty-lines: disable          # section/trailing blank lines are stylistic, not errors
  comments:
    min-spaces-from-content: 1  # the default wants two spaces before a trailing `#`; this repo writes one

# Skipped trees (one gitignore-style pattern per line; `#` is NOT a comment inside this block scalar):
#   .cache/  gitignored scratch: downloaded Talos images + benchmark output
#   secrets/ gitignored off-repo credential symlink
ignore: |
  .cache/
  secrets/
