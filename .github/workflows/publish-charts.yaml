# Publishes the hardware/OS charts to GHCR as OCI artifacts, on merge to main. The platform repo consumes them
# as pinned upstream dependencies, so Argo CD still delivers and self-heals them while they are authored here.
#
# There is no GitHub Release and no tag to cut: the registry IS the distribution channel. Consumers pin a
# version in their Chart.yaml, and Renovate resolves updates from the registry's tag list.
#
# A chart is published only when its Chart.yaml `version` is not already in the registry, so a commit that
# touches anything else is a no-op. The CI `chart-version` job is what guarantees a changed chart carries a
# bumped version in the first place.
name: publish-charts

on:
  push:
    branches: [main]
    paths: ["charts/**", ".github/workflows/publish-charts.yaml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write # push to ghcr.io

concurrency:
  group: publish-charts
  cancel-in-progress: false # never race two pushes at the same registry path

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3

      - name: log in to ghcr.io
        run: helm registry login ghcr.io -u '${{ github.actor }}' --password-stdin <<< '${{ secrets.GITHUB_TOKEN }}'

      - name: package + push each chart whose version is new
        env:
          REGISTRY: oci://ghcr.io/${{ github.repository_owner }}/charts
        run: |
          published=0
          for dir in charts/*/; do
            name="$(helm show chart "$dir" | awk '/^name:/{print $2}')"
            version="$(helm show chart "$dir" | awk '/^version:/{print $2}')"
            if helm show chart "${REGISTRY}/${name}" --version "$version" >/dev/null 2>&1; then
              echo "::notice::${name} ${version} already published, nothing to do"
              continue
            fi
            helm package "$dir" -d /tmp/pkg
            helm push "/tmp/pkg/${name}-${version}.tgz" "$REGISTRY"
            echo "::notice::published ${name} ${version}"
            published=$((published+1))
          done
          echo "published ${published} chart(s)"
