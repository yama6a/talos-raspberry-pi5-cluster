# Publishes the two hardware/OS charts to GHCR as OCI artifacts. The platform repo consumes them as pinned
# upstream dependencies, so Argo CD still delivers and self-heals them while they are authored here.
#
# Version comes from each chart's own Chart.yaml `version:`. Unlike the platform repo's wrapper charts, whose
# version is inert, THESE are published artifacts: bump the chart version in the same PR that changes it, or
# the push is rejected as an existing tag.
name: publish-charts

on:
  push:
    tags: ["charts-v*"] # cut one tag per release; the charts' own versions decide what is pushed
  workflow_dispatch:

permissions:
  contents: read
  packages: write # push to ghcr.io

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3

      - name: log in to ghcr.io
        run: helm registry login ghcr.io -u ${{ github.actor }} --password-stdin <<< "${{ secrets.GITHUB_TOKEN }}"

      # Refuses to overwrite: an existing tag means the chart version was not bumped, which would silently
      # change what every consumer already pins.
      - name: package + push
        run: |
          fail=0
          for dir in charts/*/; do
            name="$(helm show chart "$dir" | awk '/^name:/{print $2}')"
            version="$(helm show chart "$dir" | awk '/^version:/{print $2}')"
            if helm show chart "oci://ghcr.io/${{ github.repository_owner }}/charts/${name}" \
                 --version "$version" >/dev/null 2>&1; then
              echo "::error::${name} ${version} is already published; bump its Chart.yaml version"
              fail=1; continue
            fi
            helm package "$dir" -d /tmp/pkg
            helm push "/tmp/pkg/${name}-${version}.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"
          done
          exit $fail
