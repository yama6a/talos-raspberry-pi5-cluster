# Static checks only, no cluster. Each job name is a required check in gha's scripts/repo-settings.sh,
# so renaming a job here needs the same rename there.
name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shell:
    name: shell
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: yama6a/gha/.github/actions/shell-checks@v2

  yaml:
    name: yaml
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: yama6a/gha/.github/actions/yaml-checks@v2
      # Schema-checks what 03d applies. Core types only, so a kind with no schema is a mistake, not a skip.
      - uses: yama6a/gha/.github/actions/kubeconform@v2
        with:
          paths: lib/k8s/*.yaml
          crd-catalog: 'false'
          ignore-missing-schemas: 'false'

  renovate-config:
    name: renovate-config
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A broken config stops every dependency update without an error.
      - uses: yama6a/gha/.github/actions/validate-renovate-config@v2
        with:
          config-file: renovate.json5
