# Static checks only, no cluster. Each job NAME is a required check context in gha's repo-settings.sh
# table (shell, yaml, renovate-config), so renaming a job here strands the protection rule there.
name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shell:
    name: shell
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: yama6a/gha/.github/actions/shell-checks@v2

  yaml:
    name: yaml
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: yama6a/gha/.github/actions/yaml-checks@v2
      # Schema-checks what 03d applies. Core types only, so the CRD catalog is not needed, and a
      # kind with no schema is a mistake here rather than something to skip.
      - uses: yama6a/gha/.github/actions/kubeconform@v2
        with:
          paths: lib/k8s/*.yaml
          crd-catalog: 'false'
          ignore-missing-schemas: 'false'

  renovate-config:
    name: renovate-config
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A broken config silently halts ALL dependency updates.
      - uses: yama6a/gha/.github/actions/validate-renovate-config@v2
        with:
          config-file: renovate.json5
