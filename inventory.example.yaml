# Every node in the cluster. Copy and edit:  cp inventory.example.yaml inventory.yaml
# The IPs and hostnames below are fake. Reserve each IP in your router. Versions live in versions.env.
#
#   host             REQUIRED: the Kubernetes node name
#   ip               REQUIRED: the reserved IP. 03c applies config to it
#   role             REQUIRED: controlplane | worker. Control-plane nodes carry the VIP, etcd and the apiserver
#   type             REQUIRED: the hardware, stamped as node.kubernetes.io/instance-type
#   imageSource      REQUIRED: github-release | image-factory. Where the raw image and the installer come from
#   imageFile        REQUIRED: the raw-image filename 03a downloads and writes
#   imageSchematic   REQUIRED for image-factory, rejected otherwise: the extension set to build with
#   installDisk      REQUIRED: the whole device Talos installs to, as the node names it: /dev/nvme0n1, /dev/sda.
#                    EPHEMERAL and the `storage` volume land there too. To read it from a node in maintenance:
#                    make talosctl -- -n <ip> get disks --insecure
#
# The two image sources are explained in docs/04_worker_nodes.md.

nodes:
  - host: talos-cp1
    ip: 192.168.1.11
    role: controlplane
    type: rpi5 # the one type the scripts special-case: 03d hardens the NIC and 03b checks end0 and the kernel
    imageSource: github-release
    imageFile: metal-arm64-rpi5.raw.xz
    installDisk: /dev/nvme0n1

  - host: talos-cp2
    ip: 192.168.1.12
    role: controlplane
    type: rpi5
    imageSource: github-release
    imageFile: metal-arm64-rpi5.raw.xz
    installDisk: /dev/nvme0n1

  - host: talos-cp3
    ip: 192.168.1.13
    role: controlplane
    type: rpi5
    imageSource: github-release
    imageFile: metal-arm64-rpi5.raw.xz
    installDisk: /dev/nvme0n1

  # A worker. Delete this block for a control-plane-only cluster.
  - host: talos-w1
    ip: 192.168.1.14
    role: worker
    type: elitedesk800g6 # any name except rpi5. It becomes the node label
    imageSource: image-factory
    imageFile: metal-amd64.raw.xz
    imageSchematic: lib/talos/schematic-amd64.yaml
    installDisk: /dev/sda # this box boots from SATA
