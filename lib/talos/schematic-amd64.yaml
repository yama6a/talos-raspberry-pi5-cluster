# The x86_64 image recipe. factory.talos.dev turns it into one id for both the raw image and the installer.
# Names only: the factory resolves each extension for TALOS_VERSION.
customization:
  extraKernelArgs:
    - talos.dashboard.disabled=1  # machined logs every dashboard poll, which floods the log export
  systemExtensions:
    officialExtensions:
      - siderolabs/intel-ucode        # CPU errata + speculative-execution mitigations; Talos ships no microcode itself
      - siderolabs/i915               # iGPU driver and firmware. Without it there is no /dev/dri
      - siderolabs/iscsi-tools        # iSCSI-based CSI drivers need iscsid/iscsiadm in userspace
      - siderolabs/util-linux-tools   # fstrim
